name: CI Repair Agent Team

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [development]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number targeting development"
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: ci-repair-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  propose-repair:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Check out trusted base-branch automation only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: development
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install pinned static analysis tool
        run: python -m pip install ruff==0.14.10

      - name: Run zero-cost multi-agent repair team
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python scripts/agent_team.py
